<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d1408">
<title>Karo Rider</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#F6F1E7;--ink:#1d1408;--mu:#7d6d50;--gold:#E0A21B;--ok:#16A34A;--card:#fff;--ln:#EDE2CB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 14px;border-radius:0 0 22px 22px}
.top .r{display:flex;align-items:center;gap:10px}
.top h1{flex:1;margin:0;font-size:19px}.top h1 small{display:block;font-size:12px;font-weight:600;color:#cdbf9f}
.sw{position:relative;width:96px;height:38px;border-radius:99px;border:none;background:#3b2a14;color:#cdbf9f;font-weight:800;font-size:13px;cursor:pointer;padding:0 12px 0 34px;text-align:left}
.sw:before{content:'';position:absolute;left:5px;top:5px;width:28px;height:28px;border-radius:50%;background:#7d6d50;transition:.25s}
.sw.on{background:var(--ok);color:#fff;padding:0 34px 0 14px}.sw.on:before{left:63px;background:#fff}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st div{background:#2b1f10;border-radius:14px;padding:8px;text-align:center}.st b{display:block;font-size:18px}.st small{font-size:10.5px;color:#cdbf9f;font-weight:700}
.tabs{display:flex;gap:6px;margin:14px 16px 6px}
.tabs button{flex:1;border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:9px 6px;font-weight:800;font-size:13px;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs u{text-decoration:none;background:#EF4444;color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
main{padding:6px 16px 40px}
.c{background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:14px;margin-bottom:12px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.c .h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.c .h b{font-size:15px}.c .pay{font-size:20px;font-weight:900;color:var(--ok);white-space:nowrap}
.c .pay small{display:block;font-size:10.5px;color:var(--mu);text-align:right;font-weight:700}
.rt{margin:10px 0;border-left:2px dashed #d8c8a6;padding-left:12px;display:grid;gap:8px}
.rt div{position:relative;font-size:13px;line-height:1.35}.rt div:before{content:'';position:absolute;left:-19px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:2px solid #fff}
.rt div.d:before{background:var(--ok)}.rt small{display:block;color:var(--mu);font-size:11.5px}
.tg{display:inline-block;font-size:11px;font-weight:800;border-radius:99px;padding:2px 9px;background:#FEF3C7;color:#92400E;margin-right:4px}
.tg.cod{background:#1d1408;color:#F5C451}
.bt{display:flex;gap:8px;margin-top:10px}
.bt a,.bt button{flex:1;text-align:center;text-decoration:none;border:1.5px solid var(--ln);background:#FBF5E8;color:var(--ink);border-radius:14px;padding:11px 4px;font-weight:800;font-size:13px;cursor:pointer}
.bt .p{background:linear-gradient(180deg,#F8D77A,#E0A21B);border-color:#E0A21B}
.bt .g{background:var(--ok);border-color:var(--ok);color:#fff}
.e{text-align:center;color:var(--mu);font-weight:600;padding:36px 10px}
.e .i{font-size:44px}
.jn{padding:24px 16px}
.jn h2{margin:10px 0 4px}.jn p{color:var(--mu);margin:0 0 16px}
.jn label{display:block;font-size:12px;font-weight:800;color:#8a6a2a;margin:12px 0 5px}
.jn input,.jn select{width:100%;border:1.5px solid var(--ln);border-radius:14px;padding:13px;font-size:16px;background:#fff}
.jn button{width:100%;margin-top:18px;border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#F47B20,#E35D0A);color:#fff}
.pin{display:none;margin-top:10px;gap:8px}.pin.on{display:flex}
.pin input{flex:1;border:2px solid var(--gold);border-radius:14px;padding:10px;font-size:22px;text-align:center;letter-spacing:.3em}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d1408;color:#fff;padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1}
.ft{text-align:center;font-size:11px;color:var(--mu);margin:10px 0 24px;letter-spacing:.08em}
.tg.rvt{background:#EDE9FE;color:#5B21B6;font-weight:800}.c.rv{border:1.5px solid #C4B5FD}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const U='https://goyvhgpfxjpxkytpeigr.supabase.co/rest/v1/rpc/';
const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdveXZoZ3BmeGpweGt5dHBlaWdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDU4NzMsImV4cCI6MjEwODE4MTg3M30.5IYnhNkUtzjr8IvPoKezo-qnU1cLbXLbND9Kh6wOcmg';
async function rpc(fn,p){ const r=await fetch(U+fn,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'},body:JSON.stringify(p||{})}); const t=await r.text(); if(!r.ok){ let m=t; try{ m=JSON.parse(t).message||t; }catch(e){} throw new Error(m); } return t?JSON.parse(t):null; }
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const R=n=>'₹'+Math.round(n||0).toLocaleString('en-IN');
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('on'),2600); }
let ME=null, F={open:[],mine:[],done:[],me:{}}, TAB='open', seen=new Set(), first=true;
try{ ME=JSON.parse(localStorage.getItem('ko_rider')||'null'); }catch(e){}
const ago=t=>{ const m=Math.round((Date.now()-new Date(t))/6e4); return m<1?'abhi':m<60?m+' min pehle':Math.round(m/60)+' ghante pehle'; };
const map=a=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(a||'');
function beep(){ try{ const c=new (window.AudioContext||window.webkitAudioContext)(); [0,.25,.5].forEach(d=>{ const o=c.createOscillator(), g=c.createGain(); o.frequency.value=880; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(.25,c.currentTime+d); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d+.2); o.start(c.currentTime+d); o.stop(c.currentTime+d+.2); }); }catch(e){} try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
function join(){ $('app').innerHTML=`<div class="jn"><div style="font-size:52px">🛵</div><h2>Karo Online rider baniye</h2><p>Paas ki dukaanon se saaman uthayein, grahak tak pahunchayein — har delivery par kamai.</p>
  <label>AAPKA NAAM</label><input id="jN" autocomplete="name" placeholder="Pura naam"><label>MOBILE</label><input id="jP" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" placeholder="10 ank">
  <label>ILAKA</label><input id="jA" placeholder="jaise: Sadar Bazar"><label>GAADI</label><select id="jV"><option value="bike">🏍️ Bike</option><option value="cycle">🚲 Cycle</option><option value="ev">🛵 E-scooter</option><option value="walk">🚶 Paidal</option></select>
  <button onclick="doJoin()">Shuru karein</button></div><div class="ft">POWERED BY FILIPRA PRIVATE LIMITED</div>`; }
async function doJoin(){ const n=$('jN').value.trim(), p=$('jP').value.replace(/\D/g,''); if(n.length<2||!/^[6-9]\d{9}$/.test(p)){ toast('Naam aur sahi mobile likhein'); return; }
  try{ ME=await rpc('ko_rider_join',{p_name:n,p_phone:p,p_area:$('jA').value.trim(),p_vehicle:$('jV').value}); localStorage.setItem('ko_rider',JSON.stringify(ME)); toast('✅ Swagat hai '+n); setOnline(true); }catch(e){ toast('❌ '+e.message); } }
let loc=null; function gps(){ try{ navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{ loc=[p.coords.latitude,p.coords.longitude]; },()=>{}, {maximumAge:60000,timeout:8000}); }catch(e){} }
async function setOnline(on){ try{ const r=await rpc('ko_rider_online',{p_rider:ME.id,p_on:on,p_lat:loc&&loc[0],p_lng:loc&&loc[1]}); F.me=Object.assign(F.me||{},r); toast(on?'🟢 Online — nayi delivery ki request aayegi':'⚪ Offline'); }catch(e){ toast('❌ '+e.message); } load(); }
async function load(){ if(!ME) return; try{ const f=await rpc('ko_rider_feed',{p_rider:ME.id}); if(!f){ localStorage.removeItem('ko_rider'); ME=null; join(); return; } F=f;
    const nw=(F.open||[]).filter(s=>!seen.has(s.id)); (F.open||[]).forEach(s=>seen.add(s.id)); if(!first&&nw.length&&F.me&&F.me.online){ beep(); toast('🔔 Nayi delivery — '+nw[0].shop); } first=false; }catch(e){} paint(); }
function paint(){ if(!ME){ join(); return; } const me=F.me||{}, on=!!me.online;
  const L=TAB==='open'?F.open:TAB==='mine'?F.mine:F.done;
  $('app').innerHTML=`<div class="top"><div class="r"><h1>🛵 ${E(me.name||ME.name)}<small>Karo Online rider</small></h1><button class="sw ${on?'on':''}" onclick="setOnline(${!on})">${on?'Online':'Offline'}</button></div>
    <div class="st"><div><b>${(F.mine||[]).length}</b><small>CHAL RAHI</small></div><div><b>${me.trips||0}</b><small>KUL TRIPS</small></div><div><b>${R(me.earned)}</b><small>KAMAI</small></div></div></div>
   <div class="tabs"><button class="${TAB==='open'?'on':''}" onclick="TAB='open';paint()">🔔 Nayi${(F.open||[]).length?`<u>${F.open.length}</u>`:''}</button><button class="${TAB==='mine'?'on':''}" onclick="TAB='mine';paint()">🛵 Meri${(F.mine||[]).length?`<u>${F.mine.length}</u>`:''}</button><button class="${TAB==='done'?'on':''}" onclick="TAB='done';paint()">✅ Poori</button></div>
   <main>${!on&&TAB==='open'?`<div class="e"><div class="i">😴</div>Aap offline hain — upar <b>Online</b> karein, tabhi nayi delivery dikhegi</div>`:L&&L.length?L.map(s=>cardH(s)).join(''):`<div class="e"><div class="i">${TAB==='open'?'📭':TAB==='mine'?'🛵':'🏁'}</div>${TAB==='open'?'Abhi koi nayi delivery nahi — har 8 second me dekh rahe hain':TAB==='mine'?'Koi delivery chal nahi rahi':'Abhi koi delivery poori nahi'}</div>`}</main><div class="ft">POWERED BY FILIPRA PRIVATE LIMITED</div>`; }
function cardH(s){ const st=s.status, mine=TAB==='mine', rv=s.kind==='return', ex=s.kind==='exchange';
  const A={n:s.shop,a:s.shop_addr,l:'Dukaan'}, B={n:s.cust_name||'Grahak',a:s.cust_addr,l:'Grahak'}; const P=rv?B:A, D=rv?A:B;
  return `<div class="c${rv||ex?' rv':''}"><div class="h"><div>${rv?'<span class="tg rvt">↩ RETURN PICKUP</span>':ex?'<span class="tg rvt">🔄 EXCHANGE</span>':''}<b>${E(s.shop)}</b><div style="font-size:12px;color:var(--mu)">${E(s.awb)} · ${ago(s.created_at)}</div></div><div class="pay">${R(s.rider_pay)}<small>AAPKI KAMAI</small></div></div>
   <div class="rt"><div class="${['picked','on_way','delivered'].includes(st)?'d':''}"><b>Pickup:</b> ${E(P.n)}<small>${E(P.a||'')}</small></div><div class="${st==='delivered'?'d':''}"><b>Drop:</b> ${E(D.n)}<small>${E(D.a||'')}</small></div></div>
   ${ex?'<div class="tg rvt" style="display:block;margin:0 0 8px">Naya saaman grahak ko dein · purana saaman wapas dukaan laayein</div>':''}
   <div>${s.cod?`<span class="tg cod">💵 COD ${R(s.cod)} lena hai</span>`:rv?'<span class="tg">Paisa nahi lena</span>':'<span class="tg">Prepaid</span>'}<span class="tg">${(s.weight_g||500)/1000} kg</span><span class="tg">${E(s.items||'').slice(0,40)}</span></div>
   ${TAB==='open'?`<div class="bt"><a href="${map(P.a)}" target="_blank" rel="noopener">🗺️ Raasta</a><button class="p" onclick="acc(${s.id})">✓ Accept karein</button></div>`:''}
   ${mine?`<div class="bt"><a href="${map(st==='assigned'?P.a:D.a)}" target="_blank" rel="noopener">🗺️ ${st==='assigned'?P.l:D.l}</a>${st==='assigned'?`<button class="p" onclick="step(${s.id},'picked')">📦 Utha liya</button>`:st==='picked'?`<button class="p" onclick="step(${s.id},'on_way')">🛵 Nikal gaya</button>`:`<button class="g" onclick="document.getElementById('pn${s.id}').classList.add('on')">${rv?'🏪 Dukaan par de diya':'🏠 Pahuncha diya'}</button>`}</div>
    <div class="pin" id="pn${s.id}"><input id="pi${s.id}" inputmode="numeric" maxlength="4" placeholder="${rv?'Dukaandar ka PIN':'PIN'}"><button class="g" style="flex:none;border:none;border-radius:14px;padding:0 18px;color:#fff;font-weight:800;background:var(--ok)" onclick="done(${s.id})">✓</button></div>
    <div class="bt" style="margin-top:6px"><button onclick="if(confirmDrop(this))step(${s.id},'drop')">↩ Chhod dein</button></div>`:''}
   ${TAB==='done'?`<div style="font-size:12px;color:var(--ok);font-weight:800;margin-top:8px">✓ Pahunchaya · ${ago(s.updated_at)}</div>`:''}</div>`; }
function confirmDrop(b){ if(b.dataset.s) return true; b.dataset.s=1; b.textContent='Pakka? Dobara dabayein'; setTimeout(()=>{ delete b.dataset.s; b.textContent='↩ Chhod dein'; },3000); return false; }
async function acc(id){ try{ await rpc('ko_rider_accept',{p_rider:ME.id,p_id:id}); toast('✅ Aapki ho gayi — dukaan jaiye'); TAB='mine'; }catch(e){ toast('❌ '+e.message); } load(); }
async function step(id,st){ try{ await rpc('ko_rider_step',{p_rider:ME.id,p_id:id,p_step:st,p_pin:null}); toast(st==='picked'?'📦 Utha liya':st==='on_way'?'🛵 Raste me':'Chhod diya'); }catch(e){ toast('❌ '+e.message); } load(); }
async function done(id){ const p=($('pi'+id)||{}).value||''; try{ await rpc('ko_rider_step',{p_rider:ME.id,p_id:id,p_step:'delivered',p_pin:p}); beep(); toast('🎉 Delivered — kamai jud gayi'); TAB='done'; }catch(e){ toast('❌ '+e.message); } load(); }
if(ME){ paint(); gps(); load(); } else join();
setInterval(()=>{ if(ME){ load(); } },8000);
setInterval(()=>{ if(ME&&F.me&&F.me.online){ gps(); rpc('ko_rider_online',{p_rider:ME.id,p_on:true,p_lat:loc&&loc[0],p_lng:loc&&loc[1]}).catch(()=>{}); } },60000);
</script>
</body>
</html>
