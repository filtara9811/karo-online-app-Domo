name: karo_online
description: "Karo Online — Customer app (Filipra Private Limited)"
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  ota_update: ^6.0.0
  package_info_plus: ^8.1.0
  http: ^1.2.2

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/web/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
