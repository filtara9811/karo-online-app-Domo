name: karo_online
description: "Karo Online — Customer app (Filipra Private Limited)"
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  open_filex: ^4.6.0
  path_provider: ^2.1.4
  package_info_plus: ^8.1.0
  http: ^1.2.2
  share_plus: ^10.1.4
  gal: ^2.3.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/web/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
